<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Indie Café</title>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&amp;family=Red+Hat+Display:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>

:root{--p:#032d6f;--s:#f7ecd8;--t:#6f9d8a;--d:#1b294c;--ft:"Red Hat Display",system-ui,-apple-system,"Segoe UI",sans-serif;--fh:Marcellus,Georgia,"Times New Roman",serif;--bg:var(--s);--card:color-mix(in srgb,var(--s) 60%,#fff);--ink:var(--p);--mute:color-mix(in srgb,var(--p) 72%,var(--s));--line:color-mix(in srgb,var(--t) 55%,var(--s));--sg:var(--t);--acc:var(--p);--accink:var(--s);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1512;--card:#17211d;--ink:#eef2ec;--mute:#9aa89f;--line:#26332d}}
:root[data-theme="dark"]{--bg:#0e1512;--card:#17211d;--ink:#eef2ec;--mute:#9aa89f;--line:#26332d}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{background:var(--bg);color:var(--ink);font:400 var(--fs,16px)/1.5 var(--ft);max-width:var(--mw,560px);margin:0 auto;padding-bottom:40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2{font-family:var(--fh);text-transform:var(--tt,uppercase);font-weight:400}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#hd{text-align:center;padding:36px 24px 22px}
.logo{width:var(--ls,88px);height:var(--ls,88px);border-radius:var(--lr,50%);margin:0 auto 14px;background:var(--acc);color:var(--accink);display:grid;place-items:center;font:700 38px Fraunces,Georgia,serif;overflow:hidden;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.logo img{width:100%;height:100%;object-fit:cover}
h1{font-size:var(--h1,36px);line-height:1.1;letter-spacing:.04em}
#hd p{color:var(--mute);margin-top:6px;font-size:15px}
.arn{display:inline-block;margin-top:16px;padding:9px 16px;border:1px solid var(--sg);border-radius:99px;background:var(--card);color:var(--ink);font-size:13.5px;font-weight:500;line-height:1.35}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;padding:8px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:500;font-size:14px}
nav button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
section{padding:26px 18px 14px;border-top:1px solid var(--line)}
section.dk{--bg:var(--d);--ink:var(--s);--mute:color-mix(in srgb,var(--s) 72%,var(--d));--line:color-mix(in srgb,var(--s) 22%,var(--d));--sg:color-mix(in srgb,var(--t) 70%,#fff);--acc:var(--sg);background:var(--bg);color:var(--ink);padding-bottom:28px}
.gh{color:var(--sg);font-weight:500;font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin:20px 0 2px}
.gn{font-style:italic;font-size:13px;color:var(--mute)}
.nt{border:1px solid var(--ink);padding:8px 12px;text-align:center;margin:12px 0 4px;font-size:13px}
.nt b{font-weight:500}
.price{font-weight:700;color:var(--acc)}
h2{font-size:32px;line-height:1.1;letter-spacing:.03em;margin-bottom:4px}
.cd{color:var(--sg);font-size:16px;margin-bottom:8px}
.it{display:flex;gap:12px;width:100%;text-align:left;padding:10px 0;align-items:flex-start}
.it.ck{cursor:pointer}
.it .tx{flex:1;min-width:0}
.nm{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.it h3{display:inline;font:700 15px/1.3 var(--ft);letter-spacing:.02em;text-transform:uppercase}
.pr{font-weight:700;color:var(--acc);font-size:15px;text-align:right;white-space:nowrap}
.pr small{font-weight:400;font-size:12px;color:var(--mute);margin-right:8px}
.it .ds{color:var(--mute);font-size:13.5px;margin-top:2px;line-height:1.4}
.th{width:var(--th,76px);height:var(--th,76px);border-radius:var(--rd,12px);object-fit:cover;flex:none}
.ph{display:grid;place-items:center;font-size:34px;background:color-mix(in srgb,var(--acc) 14%,var(--card))}
.tg{display:inline-flex;flex-wrap:wrap;gap:5px;margin-left:8px;vertical-align:middle}
.tg span{font-size:10.5px;padding:1px 8px;border-radius:99px;border:1px solid var(--sg);color:var(--sg);font-weight:500}
.tg .nw{background:#57876f;border-color:#57876f;color:#fff;text-transform:uppercase;letter-spacing:.06em}
.ar{display:inline-flex;align-items:center;gap:6px}
.empty{padding:40px 24px;text-align:center;color:var(--mute)}
footer{padding:36px 24px 0;text-align:center;color:var(--mute);font-size:14px;line-height:1.8}
footer a{color:var(--acc);font-weight:500;text-decoration:none}
#sh,#arw{position:fixed;inset:0;z-index:50;display:none;background:rgba(10,14,12,.55)}
#sh.open,#arw.open{display:flex}
#sh{align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-width:560px;margin:0 auto;border-radius:24px 24px 0 0;max-height:92vh;overflow:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet .big{width:100%;height:240px;object-fit:cover;border-radius:24px 24px 0 0;font-size:96px}
.sheet .bd{padding:18px 20px 4px}
.sheet h3{font-size:26px;font-weight:700;line-height:1.15}
.sheet .price{font-size:22px;margin:6px 0 10px}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;padding:14px;border-radius:14px;background:var(--acc);color:var(--accink);font-weight:700;margin-top:16px}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.x{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:20px}
.sw{position:relative;width:100%;max-width:var(--mw,560px);margin:0 auto}
#arw{flex-direction:column;background:var(--bg)}
#arw model-viewer{flex:1;width:100%;min-height:0;background:var(--card)}
.arb{padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));text-align:center}
.arb p{color:var(--mute);font-size:14px}
#fc{padding:4px 0 6px}#fc h2{font-size:22px;padding:0 18px;margin:8px 0}
.fr{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 18px 10px;scrollbar-width:none}.fr::-webkit-scrollbar{display:none}
.fk{flex:none;width:190px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--rd,12px);overflow:hidden}
.fk .fi{display:grid;place-items:center;width:100%;height:130px;object-fit:cover;font-size:56px;background:color-mix(in srgb,var(--acc) 14%,var(--card))}
.fk .fb{padding:10px 12px 12px}.fk h3{font:700 14px/1.3 var(--ft);text-transform:uppercase}.fk .price{margin-top:2px}
#mn:not(.tr) .it{flex-direction:row-reverse}
.cr{margin-top:24px;font-size:12px;letter-spacing:.04em}.cr img{display:block;margin:8px auto 0;width:140px;border-radius:8px}
#hd .dsc{margin-top:12px;white-space:pre-line;line-height:1.5}.hg{display:grid;gap:10px;margin-top:16px}.hg img{width:100%;max-height:300px;object-fit:cover;border-radius:var(--rd,12px)}.cz{margin-bottom:4px}.fk{cursor:pointer}.fa{display:block;text-align:center;text-decoration:none;margin-top:8px;width:100%;padding:7px 0;border-radius:99px;border:1px solid var(--p);color:var(--p);font:600 12px var(--ft)}
.fd{font-size:12.5px;color:var(--mute);margin-top:4px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#ed{--eb:#fff;--ec:#f3f4f6;--ei:#1c1f26;--em:#6b7280;--el:#e1e4e8;--ea:#2563eb;display:none;position:fixed;inset:0;z-index:60;flex-direction:column;background:var(--eb);color:var(--ei);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
@media(prefers-color-scheme:dark){#ed{--eb:#16181d;--ec:#20242b;--ei:#eceef2;--em:#9aa1ad;--el:#2d323b;--ea:#6ea0ff}}
#ed.open{display:flex}
@media(min-width:900px){#ed{inset:0 0 0 auto;width:440px;border-left:1px solid var(--el)}html.ed-on{padding-right:440px}#e-pv{display:none}}
@media(max-width:899px){html.pv #ed{display:none}html.pv #e-fab{display:block}}
#e-fab{display:none;position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:61;padding:12px 18px;border-radius:99px;background:#2563eb;color:#fff;font:600 14px system-ui}
.eh{display:flex;align-items:center;gap:4px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;border-bottom:1px solid var(--el)}
.est{flex:1;font-size:12px;color:var(--em);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:6px}
.et{display:flex;overflow-x:auto;border-bottom:1px solid var(--el)}
.et button{flex:1;padding:10px 12px;color:var(--em);border-bottom:2px solid transparent;white-space:nowrap}
.et button.on{color:var(--ea);border-color:var(--ea);font-weight:600}
#e-body{flex:1;overflow:auto;padding:8px 14px 40px}
#ed .f{display:block;margin:10px 0;font-size:12.5px;color:var(--em);font-weight:500}
#ed input:not([type=checkbox]):not([type=range]):not([type=color]),#ed select,#ed textarea{display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--el);border-radius:8px;background:var(--ec);color:var(--ei);font:inherit}
#ed input[type=range]{width:100%;margin-top:6px;accent-color:var(--ea)}#ed input[type=color]{width:42px;height:34px;padding:0;border:0;background:none;flex:none}
.c span{display:flex;gap:8px;align-items:center}.c span input:last-child{flex:1}
.k{display:flex;gap:8px;align-items:center;margin:8px 0}.k input{accent-color:var(--ea)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pair{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.b{padding:8px 12px;border:1px solid var(--el);border-radius:8px;background:var(--ec);margin:6px 6px 0 0;font-size:13px}
.b.p,.b.on{background:var(--ea);color:#fff;border-color:var(--ea)}.b.d{color:#d33}
.ib{width:28px;height:28px;border-radius:6px;font-size:14px;flex:none}.ib:hover{background:var(--el)}
.cc{border:1px solid var(--el);border-radius:10px;margin:8px 0;overflow:hidden}.cc .cc{margin:6px 0}
.ch{display:flex;align-items:center;gap:2px;padding:6px 8px;cursor:pointer;background:var(--ec)}
.ch b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.ch small{color:var(--em);margin:0 6px;white-space:nowrap}
.cb{padding:4px 12px 12px}.sh2{margin:16px 0 4px;font-weight:700;font-size:13px}.pi{width:56px;height:56px;border-radius:8px;object-fit:cover;margin-top:6px}
#ed .hint{font-size:12px;color:var(--em);margin:6px 0}#e-j{height:44vh;font:12px ui-monospace,Menlo,monospace;white-space:pre}
</style>
</head>

let io;
function spy(){
  if (io) io.disconnect();
  if (!("IntersectionObserver" in window)) return;
  let cur = "";
  io = new IntersectionObserver(es => { const e = es.find(x => x.isIntersecting); if (!e || e.target.id === cur) return; cur = e.target.id; const nv = $("#nv"); nv.querySelectorAll("button").forEach(b => { const on = b.dataset.go === cur; b.classList.toggle("on", on); if (on) nv.scrollTo({left: b.offsetLeft - (nv.clientWidth - b.offsetWidth) / 2}); }); }, {rootMargin:"-30% 0px -65% 0px"});
  document.querySelectorAll("section").forEach(s => io.observe(s));
}
